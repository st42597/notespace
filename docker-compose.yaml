services:
  client:
    build:
      context: ./client
    container_name: notespace-client
    volumes:
      - ./client:/client
      - /client/node_modules
      - /client/.next
    networks:
      - notespace-shared
    restart: always
  api-server:
    build:
      context: ./api-server
    container_name: notespace-api-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mydb
      SPRING_DATASOURCE_USERNAME: sh
      SPRING_DATASOURCE_PASSWORD: 1234
    ports:
      - "8088:5000" # swagger
    depends_on:
      - db
    networks:
      - default
      - notespace-shared
    restart: always
  bot-server:
    build:
      context: ./bot-server
    container_name: notespace-bot-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mydb
      SPRING_DATASOURCE_USERNAME: sh
      SPRING_DATASOURCE_PASSWORD: 1234
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NOTE_API_BASE_URL: http://api-server:5000
    depends_on:
      - api-server
      - db
    networks:
      - default
      - notespace-shared
    restart: always
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: sh
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: mydb
    ports:
      - "5433:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./postgreSQL/init.sql:/docker-entrypoint-initdb.d/init.sql

networks:
  notespace-shared:
    name: notespace-shared
    external: true
